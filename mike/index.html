            ['When I was young,', ''],

        {
          mode: 'right',

            ['You have spent much of your life', ''],

        {
          mode: 'left',

          lines: [

      var activeFlowerPoemContainer = null;
      var activeFlowerMode = null;

      function setFlowerLayoutMode(mode) {
        if (!flowerLayout) return;
        flowerLayout.classList.remove('flower-layout--center', 'flower-layout--left', 'flower-layout--right', 'flower-layout--lift', 'flower-layout--finale');
        if (mode === 'finale') {
          flowerLayout.classList.add('flower-layout--center', 'flower-layout--lift', 'flower-layout--finale');
          return;
        }
        flowerLayout.classList.add('flower-layout--' + mode);
        if (mode !== 'center') {
          flowerLayout.classList.add('flower-layout--lift');
        }
      }

      function appendFlowerPoemLine(container, text, cls) {
        if (!container) return;
        if (cls === 'line-blank') {
          var spacer = document.createElement('div');
          spacer.className = 'poem-stanza-gap';
          container.appendChild(spacer);
          return;
        }

        var p = document.createElement('p');
        p.className = 'flower-poem-line' + (cls ? ' ' + cls : '');
        p.setAttribute('aria-label', text);

        var words = text.split(' ');
        var charIndex = 0;

        for (var w = 0; w < words.length; w++) {
          var wordSpan = document.createElement('span');
          wordSpan.className = 'flower-poem-word';

          for (var c = 0; c < words[w].length; c++) {
            var span = document.createElement('span');
            span.className = 'flower-poem-char';
            span.style.setProperty('--char-delay', (charIndex * 24) + 'ms');
            span.textContent = words[w][c];
            wordSpan.appendChild(span);
            charIndex++;
          }

          p.appendChild(wordSpan);

          if (w < words.length - 1) {
            var space = document.createElement('span');
            space.className = 'flower-poem-space';
            space.textContent = '\u00A0';
            p.appendChild(space);
            charIndex++;
          }
        }

        container.appendChild(p);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            p.classList.add('line-visible');
          });
        });
      }

      function getFlowerExitDirection(fromMode, toMode) {
        if (toMode === 'left') return 'left';
        if (toMode === 'right') return 'right';
        if (fromMode === 'left') return 'right';
        if (fromMode === 'right') return 'left';
        return 'right';
      }

      function spawnFlowerPoemSpecks(container, direction) {
        if (!container) return;
        for (var i = 0; i < 16; i++) {
          var speck = document.createElement('span');
          speck.className = 'poem-speck poem-speck--' + direction;
          speck.style.left = (18 + Math.random() * 64) + '%';
          speck.style.top = (12 + Math.random() * 68) + '%';
          speck.style.width = (3 + Math.random() * 5) + 'px';
          speck.style.height = speck.style.width;
          speck.style.animationDelay = (Math.random() * 120) + 'ms';
          container.appendChild(speck);
          speck.addEventListener('animationend', function () {
            if (this.parentNode) this.parentNode.removeChild(this);
          });
        }
      }

      async function clearFlowerPoemContainer(container, direction) {
        if (!container || !container.childElementCount) return;
        container.classList.remove('poem-scroll--drift-left', 'poem-scroll--drift-right');
        spawnFlowerPoemSpecks(container, direction);
        void container.offsetWidth;
        container.classList.add('poem-scroll--drift-' + direction);
        await wait(900);
        container.classList.remove('poem-scroll--drift-left', 'poem-scroll--drift-right');
        container.innerHTML = '';
      }

      function getFlowerLineDelay(text, cls) {
        if (cls === 'line-blank') return 1300;
        var charCount = (text || '').replace(/\s+/g, '').length;
        return Math.min(4200, 1250 + charCount * 42);
      }

      async function runFlowerPoem() {
        if (!flowerLayout || !poemScrollCenter || !poemScrollSide) return;

        await wait(5600);

        for (var s = 0; s < flowerPoemSections.length; s++) {
          var section = flowerPoemSections[s];
          var target  = (section.mode === 'center' || section.mode === 'finale') ? poemScrollCenter : poemScrollSide;

          if (activeFlowerPoemContainer && activeFlowerPoemContainer !== target) {
            await clearFlowerPoemContainer(activeFlowerPoemContainer, getFlowerExitDirection(activeFlowerMode, section.mode));
          } else if (target.childElementCount) {
            await clearFlowerPoemContainer(target, getFlowerExitDirection(activeFlowerMode, section.mode));
          }

          setFlowerLayoutMode(section.mode);
          await wait(section.pause);
          activeFlowerPoemContainer = target;
          activeFlowerMode = section.mode;

          for (var i = 0; i < section.lines.length; i++) {
            var line = section.lines[i];
            appendFlowerPoemLine(target, line[0], line[1]);
            await wait(getFlowerLineDelay(line[0], line[1]));
          }

          await wait(2100);
        }
      }

      runFlowerPoem();
    </script>
