    <script>
      /* Edit this poem freely — it only lives on /mike */
      function wait(ms) {
        return new Promise(function (r) { setTimeout(r, ms); });
      }

      var flowerLayout     = document.getElementById('flower-layout');
      var poemScrollCenter = document.getElementById('poem-scroll-center');
      var poemScrollSide   = document.getElementById('poem-scroll-side');

      var flowerPoemSections = [
        {
          mode: 'right',
          pause: 2400,
          lines: [
            ['For Annie, at Eighteen', 'line-title'],
            ['', 'line-blank'],
            ['Across nine thousand miles of star-anointed shore,', ''],
            ['From Boston’s winter glass I love your radiance more.', '']
          ]
        },
        {
          mode: 'left',
          pause: 1800,
          lines: [
            ['Hong Kong awakes in pearl and neon, harbor-bright,', ''],
            ['While I keep watch for you beneath a scholar’s night.', ''],
            ['', 'line-blank'],
            ['Though oceans legislate their vast republics of sea,', ''],
            ['Your name still moves through me like music through a tree.', '']
          ]
        },
        {
          mode: 'right',
          pause: 1800,
          lines: [
            ['Today you turn eighteen; the hour, in cloth-of-gold,', ''],
            ['Sets at your feet another realm for wonder to unfold.', ''],
            ['', 'line-blank'],
            ['You are my Kuromi star, half velvet dusk, half grace,', ''],
            ['With clever midnight ribboned softly round your face.', '']
          ]
        },
        {
          mode: 'left',
          pause: 1800,
          lines: [
            ['My kitty cat, all purring wit and bright capricious art,', ''],
            ['As if the moon had loaned its claws to guard a tender heart.', ''],
            ['', 'line-blank'],
            ['I know the noble weariness that follows gifted light,', ''],
            ['For both of us have borne burnout, that slow, sepulchral blight.', '']
          ]
        },
        {
          mode: 'right',
          pause: 1800,
          lines: [
            ['Yet still you read, still study, still lift your lucid sight,', ''],
            ['Like script in lamp-lit libraries refusing death by night.', ''],
            ['', 'line-blank'],
            ['I dream of picnics with you under green, intelligent skies,', ''],
            ['With books unlatched between our knees and sunlight in your eyes.', '']
          ]
        },
        {
          mode: 'left',
          pause: 1800,
          lines: [
            ['We’d annotate the afternoon with laughter, thought, and breeze,', ''],
            ['And let the grass become a text of minor ecstasies.', ''],
            ['', 'line-blank'],
            ['Then let us court the heavens in one tremendous dive,', ''],
            ['Where terror turns to rapture and the whole blue world goes alive.', '']
          ]
        },
        {
          mode: 'right',
          pause: 1800,
          lines: [
            ['And later, in the water’s lit and glassy, silver swing,', ''],
            ['You’d move as though the swimming pool had learned your secret spring.', ''],
            ['', 'line-blank'],
            ['I’d bring you omurice, gold as a hearth’s domestic flame,', ''],
            ['And spaghetti bolognese, red as the blush within your name.', '']
          ]
        },
        {
          mode: 'left',
          pause: 1800,
          lines: [
            ['Cats would approve your kingdom; even indolence would start', ''],
            ['To look like highest wisdom when it issued from your heart.', ''],
            ['', 'line-blank'],
            ['And carwashed, in Minecraft, gleams with such peculiar hue,', ''],
            ['A small enchanted password no duller soul could ever construe.', '']
          ]
        },
        {
          mode: 'right',
          pause: 1800,
          lines: [
            ['For even in made worlds of block and torch and emerald view,', ''],
            ['You leave the map more memorable for having passed it through.', ''],
            ['', 'line-blank']
          ]
        },
        {
          mode: 'center',
          pause: 2400,
          lines: [
            ['So happy eighteenth birthday, Annie; may this new year be', 'line-title'],
            ['A gentler lexicon of rest, of joy, of clarity.', ''],
            ['', 'line-blank'],
            ['And may these nine thousand miles, stern cartographers though they seem,', ''],
            ['Fold shut like paper at the hour I finally reach your dream.', ''],
            ['', 'line-blank'],
            ['Till then, from Boston’s book-lined dusk to Hong Kong’s harbor-blue,', ''],
            ['I send my brightest, rhyming heart across the dark to you.', ''],
            ['', 'line-blank'],
            ['— Mark', 'line-sig']
          ]
        }
      ];

      var activeFlowerPoemContainer = null;
      var activeFlowerMode = null;

      function setFlowerLayoutMode(mode) {
        if (!flowerLayout) return;
        flowerLayout.classList.remove('flower-layout--center', 'flower-layout--left', 'flower-layout--right', 'flower-layout--lift', 'flower-layout--finale');
        if (mode === 'finale') {
          flowerLayout.classList.add('flower-layout--center', 'flower-layout--lift', 'flower-layout--finale');
          return;
        }
        flowerLayout.classList.add('flower-layout--' + mode);
        if (mode !== 'center') {
          flowerLayout.classList.add('flower-layout--lift');
        }
      }

      function appendFlowerPoemLine(container, text, cls) {
        if (!container) return;
        if (cls === 'line-blank') {
          var spacer = document.createElement('div');
          spacer.className = 'poem-stanza-gap';
          container.appendChild(spacer);
          return;
        }

        var p = document.createElement('p');
        p.className = 'flower-poem-line' + (cls ? ' ' + cls : '');
        p.setAttribute('aria-label', text);

        var words = text.split(' ');
        var charIndex = 0;

        for (var w = 0; w < words.length; w++) {
          var wordSpan = document.createElement('span');
          wordSpan.className = 'flower-poem-word';

          for (var c = 0; c < words[w].length; c++) {
            var span = document.createElement('span');
            span.className = 'flower-poem-char';
            span.style.setProperty('--char-delay', (charIndex * 24) + 'ms');
            span.textContent = words[w][c];
            wordSpan.appendChild(span);
            charIndex++;
          }

          p.appendChild(wordSpan);

          if (w < words.length - 1) {
            var space = document.createElement('span');
            space.className = 'flower-poem-space';
            space.textContent = '\u00A0';
            p.appendChild(space);
            charIndex++;
          }
        }

        container.appendChild(p);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            p.classList.add('line-visible');
          });
        });
      }

      function getFlowerExitDirection(fromMode, toMode) {
        if (toMode === 'left') return 'left';
        if (toMode === 'right') return 'right';
        if (fromMode === 'left') return 'right';
        if (fromMode === 'right') return 'left';
        return 'right';
      }

      function spawnFlowerPoemSpecks(container, direction) {
        if (!container) return;
        for (var i = 0; i < 16; i++) {
          var speck = document.createElement('span');
          speck.className = 'poem-speck poem-speck--' + direction;
          speck.style.left = (18 + Math.random() * 64) + '%';
          speck.style.top = (12 + Math.random() * 68) + '%';
          speck.style.width = (3 + Math.random() * 5) + 'px';
          speck.style.height = speck.style.width;
          speck.style.animationDelay = (Math.random() * 120) + 'ms';
          container.appendChild(speck);
          speck.addEventListener('animationend', function () {
            if (this.parentNode) this.parentNode.removeChild(this);
          });
        }
      }

      async function clearFlowerPoemContainer(container, direction) {
        if (!container || !container.childElementCount) return;
        container.classList.remove('poem-scroll--drift-left', 'poem-scroll--drift-right');
        spawnFlowerPoemSpecks(container, direction);
        void container.offsetWidth;
        container.classList.add('poem-scroll--drift-' + direction);
        await wait(900);
        container.classList.remove('poem-scroll--drift-left', 'poem-scroll--drift-right');
        container.innerHTML = '';
      }

      function getFlowerLineDelay(text, cls) {
        if (cls === 'line-blank') return 1300;
        var charCount = (text || '').replace(/\s+/g, '').length;
        return Math.min(4200, 1250 + charCount * 42);
      }

      async function runFlowerPoem() {
        if (!flowerLayout || !poemScrollCenter || !poemScrollSide) return;

        await wait(5600);

        for (var s = 0; s < flowerPoemSections.length; s++) {
          var section = flowerPoemSections[s];
          var target  = (section.mode === 'center' || section.mode === 'finale') ? poemScrollCenter : poemScrollSide;

          if (activeFlowerPoemContainer && activeFlowerPoemContainer !== target) {
            await clearFlowerPoemContainer(activeFlowerPoemContainer, getFlowerExitDirection(activeFlowerMode, section.mode));
          } else if (target.childElementCount) {
            await clearFlowerPoemContainer(target, getFlowerExitDirection(activeFlowerMode, section.mode));
          }

          setFlowerLayoutMode(section.mode);
          await wait(section.pause);
          activeFlowerPoemContainer = target;
          activeFlowerMode = section.mode;

          for (var i = 0; i < section.lines.length; i++) {
            var line = section.lines[i];
            appendFlowerPoemLine(target, line[0], line[1]);
            await wait(getFlowerLineDelay(line[0], line[1]));
          }

          await wait(2100);
        }
      }

      runFlowerPoem();
    </script>
  </body>
</html>
