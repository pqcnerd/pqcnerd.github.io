<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Annie, at Eighteen | pqcnerd</title>
    <link rel="icon" href="./img/flowers.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <style>
      /* Poem page — night sky from local copy; edit poem below without touching birthday */
      html {
        height: 100%;
      }

      body {
        display: block;
        align-items: unset;
        justify-content: unset;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        perspective: none;
        background-color: #050510;
      }

      .sky {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .poem-page {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(2.5rem, 6vh, 4rem) clamp(1rem, 4vw, 2rem);
      }

      .poem-card {
        width: min(640px, 100%);
        background: rgba(10, 7, 29, 0.42);
        border: 1px solid rgba(192, 132, 252, 0.2);
        border-radius: 22px;
        box-shadow:
          0 18px 50px rgba(0, 0, 0, 0.35),
          0 0 28px rgba(168, 85, 247, 0.12);
        backdrop-filter: blur(12px);
        padding: clamp(1.4rem, 3.5vw, 2.2rem) clamp(1.1rem, 3vw, 1.8rem);
      }

      .poem-scroll {
        width: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.12rem;
      }

      .flower-poem-line {
        font-family: "Poppins", sans-serif;
        font-weight: 300;
        font-size: clamp(0.88rem, 2.1vw, 1.05rem);
        color: rgba(255, 255, 255, 0.94);
        line-height: 1.7;
        text-align: center;
        margin: 0;
        opacity: 0;
        transform: translateY(14px);
        transition: opacity 0.85s ease, transform 0.85s ease;
        text-shadow: 0 0 18px rgba(168, 85, 247, 0.38);
      }

      .flower-poem-line.line-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .flower-poem-line.line-title {
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-weight: 700;
        font-size: clamp(1.15rem, 3vw, 1.55rem);
        color: #f0abfc;
        margin-bottom: 0.55rem;
      }

      .flower-poem-line.line-sig {
        color: #f472b6;
        font-style: italic;
        margin-top: 0.6rem;
      }

      .poem-stanza-gap {
        height: 0.85rem;
      }

      .fireflies {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .firefly {
        position: absolute;
        width: 0.35vmin;
        height: 0.35vmin;
        border-radius: 50%;
        background: rgba(255, 255, 210, 0.95);
        box-shadow: 0 0 0.8vmin rgba(255, 245, 180, 0.9), 0 0 2vmin rgba(200, 180, 255, 0.45);
        animation: mike-firefly 9s ease-in-out infinite;
      }

      .firefly--1 { top: 22%; left: 12%; animation-delay: 0s; }
      .firefly--2 { top: 48%; left: 78%; animation-delay: 1.2s; }
      .firefly--3 { top: 68%; left: 28%; animation-delay: 2.4s; }
      .firefly--4 { top: 18%; left: 62%; animation-delay: 0.6s; }
      .firefly--5 { top: 78%; left: 55%; animation-delay: 3.1s; }
      .firefly--6 { top: 36%; left: 88%; animation-delay: 1.8s; }
      .firefly--7 { top: 55%; left: 8%; animation-delay: 4s; }
      .firefly--8 { top: 12%; left: 40%; animation-delay: 2.8s; }

      @keyframes mike-firefly {
        0%,
        100% {
          opacity: 0.15;
          transform: translate(0, 0) scale(0.7);
        }
        40% {
          opacity: 1;
          transform: translate(1.2vw, -1.8vh) scale(1.15);
        }
        70% {
          opacity: 0.45;
          transform: translate(-0.8vw, 1vh) scale(0.9);
        }
      }

      @media (max-width: 640px) {
        .poem-card {
          border-radius: 18px;
        }

        .flower-poem-line {
          line-height: 1.65;
        }
      }
    </style>
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="night"></div>
      <div class="stars stars--small"></div>
      <div class="stars stars--medium"></div>
      <div class="stars stars--large"></div>
      <div class="moon"></div>
      <div class="shooting-star"></div>
      <div class="fireflies">
        <div class="firefly firefly--1"></div>
        <div class="firefly firefly--2"></div>
        <div class="firefly firefly--3"></div>
        <div class="firefly firefly--4"></div>
        <div class="firefly firefly--5"></div>
        <div class="firefly firefly--6"></div>
        <div class="firefly firefly--7"></div>
        <div class="firefly firefly--8"></div>
      </div>
    </div>

    <main class="poem-page">
      <article class="poem-card" aria-label="For Annie, at Eighteen">
        <div class="poem-scroll" id="poem"></div>
      </article>
    </main>

    <script>
      (function () {
        var poem = [
          ["For Annie, at Eighteen", "line-title"],
          ["", "line-blank"],
          ["Across nine thousand miles of star-anointed shore,", ""],
          ["From Boston’s winter glass I love your radiance more.", ""],
          ["", "line-blank"],
          ["Hong Kong awakes in pearl and neon, harbor-bright,", ""],
          ["While I keep watch for you beneath a scholar’s night.", ""],
          ["", "line-blank"],
          ["Though oceans legislate their vast republics of sea,", ""],
          ["Your name still moves through me like music through a tree.", ""],
          ["", "line-blank"],
          ["Today you turn eighteen; the hour, in cloth-of-gold,", ""],
          ["Sets at your feet another realm for wonder to unfold.", ""],
          ["", "line-blank"],
          ["You are my Kuromi star, half velvet dusk, half grace,", ""],
          ["With clever midnight ribboned softly round your face.", ""],
          ["", "line-blank"],
          ["My kitty cat, all purring wit and bright capricious art,", ""],
          ["As if the moon had loaned its claws to guard a tender heart.", ""],
          ["", "line-blank"],
          ["I know the noble weariness that follows gifted light,", ""],
          ["For both of us have borne burnout, that slow, sepulchral blight.", ""],
          ["", "line-blank"],
          ["Yet still you read, still study, still lift your lucid sight,", ""],
          ["Like script in lamp-lit libraries refusing death by night.", ""],
          ["", "line-blank"],
          ["I dream of picnics with you under green, intelligent skies,", ""],
          ["With books unlatched between our knees and sunlight in your eyes.", ""],
          ["", "line-blank"],
          ["We’d annotate the afternoon with laughter, thought, and breeze,", ""],
          ["And let the grass become a text of minor ecstasies.", ""],
          ["", "line-blank"],
          ["Then let us court the heavens in one tremendous dive,", ""],
          ["Where terror turns to rapture and the whole blue world goes alive.", ""],
          ["", "line-blank"],
          ["And later, in the water’s lit and glassy, silver swing,", ""],
          ["You’d move as though the swimming pool had learned your secret spring.", ""],
          ["", "line-blank"],
          ["I’d bring you omurice, gold as a hearth’s domestic flame,", ""],
          ["And spaghetti bolognese, red as the blush within your name.", ""],
          ["", "line-blank"],
          ["Cats would approve your kingdom; even indolence would start", ""],
          ["To look like highest wisdom when it issued from your heart.", ""],
          ["", "line-blank"],
          ["And carwashed, in Minecraft, gleams with such peculiar hue,", ""],
          ["A small enchanted password no duller soul could ever construe.", ""],
          ["", "line-blank"],
          ["For even in made worlds of block and torch and emerald view,", ""],
          ["You leave the map more memorable for having passed it through.", ""],
          ["", "line-blank"],
          ["So happy eighteenth birthday, Annie; may this new year be", "line-title"],
          ["A gentler lexicon of rest, of joy, of clarity.", ""],
          ["", "line-blank"],
          ["And may these nine thousand miles, stern cartographers though they seem,", ""],
          ["Fold shut like paper at the hour I finally reach your dream.", ""],
          ["", "line-blank"],
          ["Till then, from Boston’s book-lined dusk to Hong Kong’s harbor-blue,", ""],
          ["I send my brightest, rhyming heart across the dark to you.", ""],
          ["", "line-blank"],
          ["— Mark", "line-sig"]
        ];

        var root = document.getElementById("poem");

        function wait(ms) {
          return new Promise(function (resolve) {
            setTimeout(resolve, ms);
          });
        }

        function appendLine(text, cls) {
          if (cls === "line-blank") {
            var spacer = document.createElement("div");
            spacer.className = "poem-stanza-gap";
            root.appendChild(spacer);
            return spacer;
          }

          var p = document.createElement("p");
          p.className = "flower-poem-line" + (cls ? " " + cls : "");
          p.textContent = text;
          root.appendChild(p);
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              p.classList.add("line-visible");
            });
          });
          return p;
        }

        async function run() {
          await wait(600);
          for (var i = 0; i < poem.length; i++) {
            var line = poem[i];
            var el = appendLine(line[0], line[1]);
            if (line[1] !== "line-blank") {
              el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
            await wait(line[1] === "line-blank" ? 420 : 780);
          }
        }

        run();
      })();
    </script>
  </body>
</html>
